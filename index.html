<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interface web pour uploader un ISO et contrôler une machine virtuelle dans le navigateur."
    />
    <title>VM Web - Test-vm</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">GitHub repo project</p>
          <h1>VM Web</h1>
        </div>
        <span class="badge">PC + Smartphone</span>
      </header>

      <main class="grid">
        <section class="panel">
          <h2>1. Uploader un ISO</h2>

          <label class="upload-box" for="isoFile">
            <input id="isoFile" type="file" accept=".iso" />
            <span id="fileName">Choisir un fichier ISO</span>
          </label>

          <div class="button-row">
            <button id="uploadBtn" class="primary">Uploader l’ISO</button>
          </div>

          <div id="uploadStatus" class="status muted">Aucun fichier sélectionné.</div>
        </section>

        <section class="panel">
          <h2>2. Contrôler la VM</h2>

          <div class="vm-meta">
            <div>
              <span class="label">État</span>
              <strong id="vmState">Arrêtée</strong>
            </div>
            <div>
              <span class="label">ISO</span>
              <strong id="isoInfo">Aucune</strong>
            </div>
          </div>

          <div class="button-row two">
            <button id="startBtn" class="success">Démarrer</button>
            <button id="stopBtn" class="danger">Arrêter</button>
          </div>
        </section>
      </main>

      <section class="panel console-panel">
        <div class="console-header">
          <h2>Console VM</h2>
          <div class="toolbar">
            <button id="refreshBtn" class="ghost">Actualiser</button>
            <button id="fullBtn" class="ghost">Plein écran</button>
          </div>
        </div>

        <div class="console-wrap">
          <iframe
            id="vmFrame"
            title="Console VM"
            src="about:blank"
            allowfullscreen
          ></iframe>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
